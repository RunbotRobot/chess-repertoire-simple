name: Ingest Lichess repertoire data

# Runs pipeline/chunked-ingest.mjs against a real Lichess monthly dump.
# GitHub-hosted runners are free with no minute cap on a public repo (this
# one), but a single job is hard-capped at 6h -- so this relays itself
# across runs rather than trying to finish in one shot:
#   1. Restore whatever internal checkpoint state (nodes.json/pending.json/
#      meta.json) the last run left behind, from the ingest-checkpoint
#      branch (a single force-pushed commit, not an accumulating history --
#      it's disposable working state, not something worth keeping old
#      versions of).
#   2. Run the ingestion for up to 5.5h, well under the 6h job limit, so
#      there's always time left to commit before the job gets killed --
#      pushing checkpoint state and repertoire data out incrementally as
#      chunked-ingest.mjs's own periodic checkpoints land (every
#      chunkMinutes), not just once at the very end. A single end-of-job
#      push would mean a crash for any reason (disk full, OOM, a transient
#      network failure) loses the *entire* run with nothing to show for it;
#      incremental pushes bound the loss to one chunk's worth, the same
#      guarantee chunked-ingest.mjs already gives for an ordinary restart.
# The schedule interval (6h) matches the job cap so runs never overlap in
# steady state; the concurrency group is a backstop against that anyway.
on:
  workflow_dispatch:
    inputs:
      chunkMinutes:
        description: 'Internal checkpoint interval in minutes (within one job run)'
        default: '5'
      maxPlies:
        description: 'Max depth in half-moves'
        default: '40'
      minGames:
        description: 'Minimum games for a position to qualify'
        default: '10'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  DUMP_URL: https://database.lichess.org/standard/lichess_db_standard_rated_2026-07.pgn.zst
  # 5, not the more obvious 20-60: the FIRST checkpoint in any run is
  # uniquely expensive (unlike every later one -- see streaming-engine.mjs's
  # finish() doc comment on registerChain only ever running once per
  # record), since it has to reconcile the ENTIRE backlog of games parked
  # since the process started, all at once, over the live Lichess API. A
  # 20-minute window let that first backlog grow large enough, on a real
  # month-scale dataset, that reconciling it alone ran past 80+ minutes with
  # nothing to show for it. A short window bounds how big that one-time
  # backlog can ever get, for every run (not just the very first) since a
  # crash/restart re-creates the same "cold start" condition.
  CHUNK_MINUTES: ${{ github.event.inputs.chunkMinutes || '5' }}
  MAX_PLIES: ${{ github.event.inputs.maxPlies || '40' }}
  MIN_GAMES: ${{ github.event.inputs.minGames || '10' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Restore checkpoint state from ingest-checkpoint branch, if any
        run: |
          mkdir -p ckpt
          if git -C repo fetch origin ingest-checkpoint 2>/dev/null; then
            git -C repo archive origin/ingest-checkpoint | tar -x -C ckpt
            echo "Restored checkpoint: $(ls -la ckpt)"
          else
            echo "No ingest-checkpoint branch yet -- starting fresh."
          fi

      - name: Disk space before ingesting
        run: df -h /

      - name: Run ingestion, pushing checkpoints as they land
        run: |
          cd "$GITHUB_WORKSPACE/repo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd "$GITHUB_WORKSPACE"

          # Pushes whatever's currently in ckpt/: the internal state
          # (nodes/pending/meta -- disposable, so a single force-pushed
          # commit rather than accumulating history) to ingest-checkpoint,
          # and the small, actually-useful repertoire-{white,black}.json to
          # data/ on main, which is what the app reads.
          push_checkpoint() {
            if [ -f ckpt/nodes.json ]; then
              rm -rf ckpt_push && cp -r ckpt ckpt_push
              (
                cd ckpt_push
                git init -q
                git checkout -q -b ingest-checkpoint
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add nodes.json pending.json meta.json progress.log
                git commit -q -m "Checkpoint state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                git push -q --force origin ingest-checkpoint
              )
            fi
            if [ -f ckpt/repertoire-white.json ]; then
              mkdir -p repo/data
              cp ckpt/repertoire-white.json ckpt/repertoire-black.json repo/data/
              (
                cd repo
                git add data/repertoire-white.json data/repertoire-black.json
                if ! git diff --cached --quiet; then
                  WHITE_PICK=$(node -e "const d=require('./data/repertoire-white.json');console.log((d.root.myMove?.san||'?')+' '+d.root.total+'g')")
                  git commit -q -m "Update repertoire checkpoint data ($(date -u +%Y-%m-%dT%H:%M:%SZ), white picks ${WHITE_PICK})"
                  git pull -q --rebase origin main
                  git push -q origin main
                fi
              )
            fi
          }

          # Pushes just progress.log, on its own, every poll -- separate from
          # push_checkpoint's full bundle (which only fires when a whole
          # checkpoint actually lands). chunked-ingest.mjs's log() appends
          # to this file synchronously throughout the run, including now
          # from inside a long-running finish() call (see streaming-engine.
          # mjs's onRound/onFetch hooks) -- pushing it eagerly is the only
          # way to see live signs of life during a long reconciliation,
          # rather than only finding out what happened after the fact.
          LAST_LOG_SIZE=""
          push_progress_log() {
            [ -f ckpt/progress.log ] || return 0
            CUR_SIZE=$(stat -c %s ckpt/progress.log 2>/dev/null || echo "")
            [ "$CUR_SIZE" = "$LAST_LOG_SIZE" ] && return 0
            LAST_LOG_SIZE="$CUR_SIZE"
            rm -rf log_push && mkdir log_push && cp ckpt/progress.log log_push/
            (
              cd log_push
              git init -q
              git checkout -q -b ingest-checkpoint
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add progress.log
              git commit -q -m "Progress log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              # Only the log, not the full checkpoint state -- if a real
              # checkpoint push raced with this, this must never clobber it.
              # Both are single-commit force-pushes to the same disposable
              # branch, so lose the race gracefully rather than fight it.
              git push -q --force origin ingest-checkpoint || echo "progress.log push skipped (lost race with a real checkpoint push, harmless)"
            )
          }

          timeout 5.5h node repo/pipeline/chunked-ingest.mjs \
            "$DUMP_URL" \
            "$GITHUB_WORKSPACE/ckpt" \
            "$CHUNK_MINUTES" "$MAX_PLIES" "$MIN_GAMES" &
          INGEST_PID=$!

          LAST=""
          while kill -0 "$INGEST_PID" 2>/dev/null; do
            sleep 300
            push_progress_log
            if [ -f ckpt/nodes.json ]; then
              CUR=$(stat -c %Y ckpt/nodes.json 2>/dev/null || echo "")
              if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ]; then
                echo "--- New checkpoint detected at $(date -u +%Y-%m-%dT%H:%M:%SZ), pushing ---"
                du -sh ckpt/*.json 2>/dev/null
                df -h /
                push_checkpoint
                LAST="$CUR"
              fi
            fi
          done

          set +e
          wait "$INGEST_PID"
          code=$?
          set -e
          echo "chunked-ingest.mjs exited with code $code"
          push_checkpoint # final push, covers whatever landed since the last poll
          # 124 = timeout hit the 5.5h bound, which is expected and fine;
          # anything else nonzero is a real failure worth surfacing (after
          # the push above already ran, so we don't lose progress reporting it).
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "chunked-ingest.mjs exited with unexpected code $code"
            exit "$code"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disk space after ingesting
        if: always()
        run: df -h / && du -sh ckpt/*.json 2>/dev/null
