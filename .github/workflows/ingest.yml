name: Ingest Lichess repertoire data

# Runs pipeline/chunked-ingest.mjs against a real Lichess monthly dump.
# GitHub-hosted runners are free with no minute cap on a public repo (this
# one), but a single job is hard-capped at 6h -- so this relays itself
# across runs rather than trying to finish in one shot:
#   1. Restore whatever internal checkpoint state (nodes.json/pending.json/
#      meta.json) the last run left behind, from the ingest-checkpoint
#      branch (a single force-pushed commit, not an accumulating history --
#      it's disposable working state, not something worth keeping old
#      versions of).
#   2. Run the ingestion for up to 5.5h, well under the 6h job limit, so
#      there's always time left to commit before the job gets killed --
#      pushing checkpoint state and repertoire data out incrementally as
#      chunked-ingest.mjs's own periodic checkpoints land (every
#      chunkMinutes), not just once at the very end. A single end-of-job
#      push would mean a crash for any reason (disk full, OOM, a transient
#      network failure) loses the *entire* run with nothing to show for it;
#      incremental pushes bound the loss to one chunk's worth, the same
#      guarantee chunked-ingest.mjs already gives for an ordinary restart.
# A recoverable node-process failure (the recurring case in practice: a
# transient network blip mid-download on the ~29GB dump) is retried
# in-loop within the same job, from the checkpoint it just saved -- see the
# "Run ingestion" step below. That handles the common case in seconds. The
# schedule below is just a backstop for the job dying outright (runner
# failure, OOM, GitHub infra issue) that the in-job retry can't catch --
# it's hourly rather than matched to the 6h job cap, since the concurrency
# group already prevents overlap regardless of how often it fires.
on:
  workflow_dispatch:
    inputs:
      chunkMinutes:
        description: 'Target checkpoint cadence in minutes (both a feed-time cap and a reconciliation deadline -- see chunked-ingest.mjs)'
        default: '60'
      maxPlies:
        description: 'Max depth in half-moves'
        default: '40'
      minGames:
        description: 'Minimum games for a position to qualify'
        default: '10'
      maxPendingBacklog:
        description: 'Pause feeding early once this many games are unresolved, so production cannot outrun reconciliation without bound'
        default: '50000'
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  DUMP_URL: https://database.lichess.org/standard/lichess_db_standard_rated_2026-07.pgn.zst
  # chunkMinutes now doubles as BOTH the feed-phase trigger and
  # builder.finish()'s own reconciliation deadline (see chunked-ingest.mjs's
  # header) -- so a checkpoint reliably lands roughly every chunkMinutes
  # regardless of how big the backlog gets, and maxPendingBacklog keeps
  # feeding from ever outrunning what reconciliation can plausibly catch up
  # on within that same window. Measured on the real July 2026 dump: local
  # ingestion (~1500 games/s) vastly outpaces reconciliation (~1440
  # ids/min observed under real, possibly rate-limited, load) -- 50000
  # leaves meaningful headroom below the roughly ~86000/hour that pace
  # implies, so most of each hour's window is actually spent catching up
  # rather than still feeding.
  CHUNK_MINUTES: ${{ github.event.inputs.chunkMinutes || '60' }}
  MAX_PLIES: ${{ github.event.inputs.maxPlies || '40' }}
  MIN_GAMES: ${{ github.event.inputs.minGames || '10' }}
  MAX_PENDING_BACKLOG: ${{ github.event.inputs.maxPendingBacklog || '50000' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Restore checkpoint state from ingest-checkpoint branch, if any
        run: |
          mkdir -p ckpt
          if git -C repo fetch origin ingest-checkpoint 2>/dev/null; then
            git -C repo archive origin/ingest-checkpoint | tar -x -C ckpt
            echo "Restored checkpoint: $(ls -la ckpt)"
          else
            echo "No ingest-checkpoint branch yet -- starting fresh."
          fi

      - name: Disk space before ingesting
        run: df -h /

      - name: Run ingestion, pushing checkpoints as they land
        run: |
          cd "$GITHUB_WORKSPACE/repo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd "$GITHUB_WORKSPACE"

          # Pushes whatever's currently in ckpt/: the internal state
          # (nodes/pending/meta -- disposable, so a single force-pushed
          # commit rather than accumulating history) to ingest-checkpoint,
          # and the small, actually-useful repertoire-{white,black}.json to
          # data/ on main, which is what the app reads.
          #
          # Every git operation below is guarded with `|| echo ...` rather
          # than left to this script's default errexit (GitHub Actions runs
          # `run:` steps with `bash -e`) -- this function is called from
          # inside the live polling loop further down, NOT just at the very
          # end, so an unguarded failure here doesn't just lose one push, it
          # kills the entire multi-hour job outright, including the still-
          # healthy node process underneath it. That's exactly what happened
          # in production: main's repertoire-*.json grew past GitHub's
          # 100MB file limit, the push was rejected, and the whole job died
          # silently for over an hour with nothing to restart it. A rejected
          # push is real signal (surfaced via the echo) but must never be
          # allowed to take down the run -- the next checkpoint gets another
          # chance regardless of why the previous one failed.
          push_checkpoint() {
            if [ -f ckpt/nodes.json ]; then
              rm -rf ckpt_push && cp -r ckpt ckpt_push
              (
                cd ckpt_push
                git init -q
                git checkout -q -b ingest-checkpoint
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add nodes.json pending.json meta.json progress.log
                git commit -q -m "Checkpoint state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                git push -q --force origin ingest-checkpoint
              ) || echo "Checkpoint state push failed -- will retry at the next checkpoint, not fatal to the run."
            fi
            if [ -f ckpt/repertoire-white.json ]; then
              mkdir -p repo/data
              cp ckpt/repertoire-white.json ckpt/repertoire-black.json repo/data/
              (
                cd repo
                git add data/repertoire-white.json data/repertoire-black.json
                if ! git diff --cached --quiet; then
                  WHITE_PICK=$(node -e "const d=require('./data/repertoire-white.json');console.log((d.root.myMove?.san||'?')+' '+d.root.total+'g')")
                  git commit -q -m "Update repertoire checkpoint data ($(date -u +%Y-%m-%dT%H:%M:%SZ), white picks ${WHITE_PICK})"
                  git pull -q --rebase origin main
                  git push -q origin main
                fi
              ) || echo "Repertoire data push to main failed -- will retry at the next checkpoint, not fatal to the run."
            fi
          }

          # Pushes just progress.log, on its own, every poll -- separate from
          # push_checkpoint's full bundle (which only fires when a whole
          # checkpoint actually lands). chunked-ingest.mjs's log() appends
          # to this file synchronously throughout the run, including now
          # from inside a long-running finish() call (see streaming-engine.
          # mjs's onRound/onFetch hooks) -- pushing it eagerly is the only
          # way to see live signs of life during a long reconciliation,
          # rather than only finding out what happened after the fact.
          LAST_LOG_SIZE=""
          push_progress_log() {
            [ -f ckpt/progress.log ] || return 0
            CUR_SIZE=$(stat -c %s ckpt/progress.log 2>/dev/null || echo "")
            [ "$CUR_SIZE" = "$LAST_LOG_SIZE" ] && return 0
            LAST_LOG_SIZE="$CUR_SIZE"
            rm -rf log_push && mkdir log_push && cp ckpt/progress.log log_push/
            (
              cd log_push
              git init -q
              git checkout -q -b ingest-checkpoint
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add progress.log
              git commit -q -m "Progress log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              # Only the log, not the full checkpoint state -- if a real
              # checkpoint push raced with this, this must never clobber it.
              # Both are single-commit force-pushes to the same disposable
              # branch, so lose the race gracefully rather than fight it.
              git push -q --force origin ingest-checkpoint || echo "progress.log push skipped (lost race with a real checkpoint push, harmless)"
            )
          }

          # Relaunches chunked-ingest.mjs in a loop, from whatever checkpoint
          # the previous attempt left behind, instead of letting one
          # recoverable failure (in practice, almost always a transient
          # network blip mid-download on the dump) end the whole job and
          # leave the pipeline idle until the next scheduled tick. DEADLINE
          # is the same 5.5h budget the old single `timeout 5.5h` call used
          # -- still well under the 6h job cap -- just now shared across
          # however many attempts fit inside it rather than spent on one.
          #
          # FAST_FAIL_COUNT guards against burning the whole budget on a
          # crash loop: a real bug (bad args, a code error) fails almost
          # immediately every time, which looks nothing like "downloaded
          # most of a 29GB file, then the connection dropped" -- so five
          # attempts in a row each lasting under 30s is treated as a real
          # failure worth surfacing, not noise worth swallowing.
          DEADLINE=$(( $(date +%s) + 5*3600 + 30*60 ))
          LAST=""
          ATTEMPT=0
          FAST_FAIL_COUNT=0

          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            NOW=$(date +%s)
            REMAINING=$((DEADLINE - NOW))
            if [ "$REMAINING" -le 60 ]; then
              echo "=== Less than a minute left in this job's budget -- stopping the retry loop ==="
              break
            fi
            echo "=== Ingestion attempt $ATTEMPT, ${REMAINING}s remaining in this job's budget ==="
            ATTEMPT_START=$(date +%s)

            timeout "${REMAINING}s" node repo/pipeline/chunked-ingest.mjs \
              "$DUMP_URL" \
              "$GITHUB_WORKSPACE/ckpt" \
              "$CHUNK_MINUTES" "$MAX_PLIES" "$MIN_GAMES" "$MAX_PENDING_BACKLOG" &
            INGEST_PID=$!

            while kill -0 "$INGEST_PID" 2>/dev/null; do
              sleep 300
              push_progress_log
              if [ -f ckpt/nodes.json ]; then
                CUR=$(stat -c %Y ckpt/nodes.json 2>/dev/null || echo "")
                if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ]; then
                  echo "--- New checkpoint detected at $(date -u +%Y-%m-%dT%H:%M:%SZ), pushing ---"
                  du -sh ckpt/*.json 2>/dev/null
                  df -h /
                  push_checkpoint
                  LAST="$CUR"
                fi
              fi
            done

            set +e
            wait "$INGEST_PID"
            code=$?
            set -e
            ATTEMPT_DURATION=$(( $(date +%s) - ATTEMPT_START ))
            echo "chunked-ingest.mjs (attempt $ATTEMPT) exited with code $code after ${ATTEMPT_DURATION}s"
            push_checkpoint # covers whatever landed since the last poll, win or lose

            if [ "$code" -eq 124 ]; then
              echo "=== Hit this job's time budget -- stopping cleanly, a future run will continue from here ==="
              break
            elif [ "$code" -eq 0 ]; then
              echo "=== Stream exhausted -- the full month is fully processed, nothing left to do ==="
              break
            fi

            if [ "$ATTEMPT_DURATION" -lt 30 ]; then
              FAST_FAIL_COUNT=$((FAST_FAIL_COUNT + 1))
            else
              FAST_FAIL_COUNT=0
            fi
            if [ "$FAST_FAIL_COUNT" -ge 5 ]; then
              echo "=== $FAST_FAIL_COUNT fast failures in a row -- this doesn't look like a transient network blip, stopping to avoid burning the whole job budget on a crash loop ==="
              exit "$code"
            fi
            echo "Non-zero exit ($code), consistent with a recoverable network hiccup -- retrying from checkpoint in 5s."
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disk space after ingesting
        if: always()
        run: df -h / && du -sh ckpt/*.json 2>/dev/null
